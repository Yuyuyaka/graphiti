name: Build and publish Graphiti image

on:
  workflow_dispatch:
    inputs:
      registry:
        description: 'Registry to push to: dockerhub or ghcr'
        required: true
        default: 'dockerhub'
      image_tag:
        description: 'Image tag to publish'
        required: true
        default: 'embedder-chunking-20260512'
      git_ref:
        description: 'Git ref (branch/tag) in the fork to install graphiti from'
        required: true
        default: 'fix/embedder-chunking-20260512'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        if: ${{ github.event.inputs.registry == 'dockerhub' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: ${{ github.event.inputs.registry == 'ghcr' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push (Docker Hub)
        if: ${{ github.event.inputs.registry == 'dockerhub' }}
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/graphiti:${{ github.event.inputs.image_tag }}
          build-args: |
            GITHUB_FORK=${{ github.repository_owner }}
            GRAPHITI_PIP_REF=${{ github.event.inputs.git_ref }}

      - name: Build and push (GHCR)
        if: ${{ github.event.inputs.registry == 'ghcr' }}
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/graphiti:${{ github.event.inputs.image_tag }}
          build-args: |
            GITHUB_FORK=${{ github.repository_owner }}
            GRAPHITI_PIP_REF=${{ github.event.inputs.git_ref }}
